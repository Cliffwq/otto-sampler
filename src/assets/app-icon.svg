  <g stroke="#263844" stroke-width="6">
    <rect x="164" y="408" width="136" height="136" rx="14" fill="url(#pad)"/>
    <rect x="324" y="408" width="136" height="136" rx="14" fill="url(#red)"/>
    <rect x="484" y="408" width="136" height="136" rx="14" fill="url(#pad)"/>
    <rect x="164" y="568" width="136" height="136" rx="14" fill="url(#pad)"/>
    <rect x="324" y="568" width="136" height="136" rx="14" fill="url(#pad)"/>
    <rect x="484" y="568" width="136" height="136" rx="14" fill="url(#pad)"/>
    <rect x="164" y="728" width="136" height="136" rx="14" fill="url(#ivory)"/>
    <rect x="324" y="728" width="136" height="136" rx="14" fill="url(#pad)"/>
